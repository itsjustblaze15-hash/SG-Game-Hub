<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PITCHSIDE — Bet. Watch. Win.</title>
<link id="fav" rel="icon" type="image/png" />
<style>
:root{
  --bg:#031009; --bg2:#06180d; --panel:rgba(10,36,23,.92); --panel2:rgba(15,50,32,.95); --panel3:rgba(22,70,44,.95);
  --line:rgba(120,255,170,.14); --line2:rgba(120,255,170,.30);
  --accent:#22e06b; --accent2:#12b556; --accent-ink:#03140a; --text:#eafff1; --muted:#8fb8a0;
  --gold:#ffd24a; --red:#ff5a5f; --amber:#ffb23e; --shadow:0 18px 50px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 12% 8%,rgba(34,224,107,.14),transparent 30%),radial-gradient(circle at 90% 0%,rgba(18,181,86,.12),transparent 26%),linear-gradient(180deg,#031009,#05160b 45%,#031009);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
img.lg{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.app{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:18px 22px 60px}

/* top bar */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(30,90,55,.85),rgba(8,28,17,.95));box-shadow:var(--shadow);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{width:46px;height:46px;border-radius:12px;object-fit:contain;background:rgba(0,0,0,.25);padding:3px}
.brand h1{margin:0;font-size:24px;letter-spacing:.06em;font-weight:900}
.brand h1 span{color:var(--accent)}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.wallet{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--line2)}
.wallet .lbl{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.wallet .amt{font-size:24px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.wallet .ico{font-size:26px}
.speed{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.speed button{background:transparent;padding:8px 12px;border-radius:10px;font-weight:800;font-size:13px;color:var(--muted)}
.speed button.on{background:var(--accent);color:var(--accent-ink)}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:900;border-radius:12px;padding:10px 16px;letter-spacing:.03em;transition:.15s}
.btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--line2)}
.btn.gold{background:var(--gold)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn.red{background:var(--red);color:#fff}

.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:11px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:800;color:var(--muted);letter-spacing:.04em}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .bd{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:99px;background:rgba(0,0,0,.28);color:#fff;font-size:11px;text-align:center}
.tab.on .bd{background:rgba(0,0,0,.25);color:var(--accent-ink)}
.tab .bd.live{background:var(--red);color:#fff}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.sec-title b{color:var(--accent)}

/* fixtures */
.fx{padding:16px 18px;margin-bottom:12px;transition:.15s}
.fx:hover{border-color:var(--line2)}
.fx-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(34,224,107,.12);color:var(--accent);font-weight:800;font-size:11px;letter-spacing:.08em}
.chip.live{background:rgba(255,90,95,.16);color:var(--red)}
.chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1s infinite}
.chip.gold{background:rgba(255,210,74,.14);color:var(--gold)}
@keyframes pulse{50%{opacity:.25}}
.fx-main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.6fr);gap:18px;align-items:center}
.teams .tr{display:flex;align-items:center;gap:12px;padding:5px 0}
.teams .nm{font-weight:900;font-size:17px;line-height:1.1}
.teams .sub{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:11px;color:var(--muted)}
.form{display:inline-flex;gap:3px}
.form i{width:15px;height:15px;border-radius:4px;font-style:normal;font-size:9px;font-weight:900;display:grid;place-items:center;color:#031009}
.form i.W{background:var(--accent)} .form i.D{background:#b7c4bc} .form i.L{background:var(--red);color:#fff}
.ovr{padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.08);font-weight:800;color:var(--text)}
.mk{display:flex;gap:14px;flex-wrap:wrap}
.mk .grp{flex:1 1 150px}
.mk .gl{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:5px;font-weight:800}
.odds{display:flex;gap:6px}
.odd{flex:1;min-width:0;padding:8px 4px;border-radius:12px;background:rgba(0,0,0,.32);border:1px solid var(--line);text-align:center;transition:.12s}
.odd .k{display:block;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.08em}
.odd .v{display:block;font-size:16px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.odd:hover:not(:disabled){border-color:var(--accent);background:rgba(34,224,107,.12)}
.odd.sel,.odd.sel:hover:not(:disabled){background:var(--accent);border-color:var(--accent)}
.odd.sel .k,.odd.sel .v{color:var(--accent-ink)}
.odd:disabled{opacity:.35}
.fx-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.cd{font-variant-numeric:tabular-nums;font-weight:900;color:var(--text);font-size:14px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* live card */
.lv{padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-color:rgba(255,90,95,.35)}
.lv .sc{display:flex;align-items:center;gap:16px;font-size:20px;font-weight:900}
.lv .sc .n{min-width:0;flex:1}
.lv .sc .s{font-size:30px;font-variant-numeric:tabular-nums;color:var(--accent);padding:2px 14px;border-radius:12px;background:rgba(0,0,0,.35)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* slip */
.slip{position:sticky;top:14px;padding:16px}
.slip h2{margin:0 0 4px;font-size:16px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:rgba(0,0,0,.35);margin:10px 0}
.seg button{padding:8px;border-radius:9px;background:transparent;font-weight:800;color:var(--muted);font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.leg{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 11px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);margin-bottom:7px;font-size:13px}
.leg .t{font-weight:800}.leg .m{color:var(--muted);font-size:11px;grid-column:1}
.leg .o{color:var(--gold);font-weight:900;grid-row:1;grid-column:2;text-align:right}
.leg .x{grid-row:2;grid-column:2;background:none;color:var(--muted);font-size:11px;text-align:right;padding:0}
.leg .x:hover{color:var(--red)}
.stake{display:flex;align-items:center;gap:8px;margin:10px 0 8px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid var(--line2)}
.stake span{color:var(--gold);font-weight:900;font-size:18px}
.stake input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chips button{padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12px;font-weight:800}
.chips button:hover{border-color:var(--accent)}
.sum{display:flex;justify-content:space-between;font-size:13px;margin:4px 0;color:var(--muted)}
.sum b{color:var(--text)} .sum .pay{color:var(--accent);font-size:18px}
.slip .btn{width:100%;margin-top:10px;padding:13px;font-size:15px}

/* bets */
.bet{padding:14px 16px;margin-bottom:10px}
.bet.won{border-color:rgba(34,224,107,.55)} .bet.lost{border-color:rgba(255,90,95,.4);opacity:.85}
.bet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.bet .lg2{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px;border-top:1px dashed var(--line)}
.bet .lg2 .r{font-weight:900}
.res-w{color:var(--accent)}.res-l{color:var(--red)}
.bet .ft{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted);align-items:center}
.bet .ft b{color:var(--text)}

/* results */
.rs{display:grid;grid-template-columns:1fr auto 1fr auto;gap:14px;align-items:center;padding:12px 18px;margin-bottom:8px}
.rs .tm{display:flex;align-items:center;gap:10px;font-weight:800}
.rs .tm.r{justify-content:flex-end;text-align:right}
.rs .sc{font-size:22px;font-weight:900;padding:3px 14px;border-radius:10px;background:rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{padding:16px 18px}.tile .l{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:800}.tile .v{font-size:28px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}

/* toasts */
#toasts{position:fixed;right:18px;top:18px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 36px))}
.toast{padding:12px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;box-shadow:var(--shadow);animation:tin .2s ease-out;cursor:default;font-size:14px}
.toast.bad{background:var(--red);color:#fff}.toast.gold{background:var(--gold)}.toast.dark{background:#0f3d25;color:var(--text);border:1px solid var(--line2)}
.toast.click{cursor:pointer}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

/* VIEWER */
.viewer{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;overflow:auto;background:radial-gradient(circle at 50% -10%,#14693a 0%,#06210f 45%,#02100a 100%)}
.v-in{width:min(1500px,100%);margin:0 auto;padding:14px 22px 22px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.v-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.v-score{display:flex;align-items:center;justify-content:center;gap:22px;padding:6px 0 4px}
.v-score .nm{font-size:26px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0}
.v-score .nm.l{text-align:right}
.v-score img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.v-score .mid{text-align:center;min-width:150px}
.v-score .sc{font-size:54px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:0 0 22px rgba(34,224,107,.5)}
.v-score .clk{font-size:15px;font-weight:800;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.v-prog{height:4px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.v-prog i{display:block;height:100%;background:var(--accent);width:0}
.v-body{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:14px;align-items:start}
.lu{padding:10px 8px;border-radius:16px;background:rgba(2,16,9,.7);border:1px solid var(--line)}
.lu h4{margin:2px 8px 8px;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.lu .p{display:grid;grid-template-columns:22px 1fr 38px;gap:6px;align-items:center;padding:6px 8px;font-size:14px;font-weight:700;border-radius:8px}
.lu.r .p{grid-template-columns:38px 1fr 22px}
.lu .p:nth-child(odd){background:rgba(255,255,255,.03)}
.lu .p .no{color:#9ad0ff;font-weight:800;font-size:13px}
.lu .p .nmp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu .p .rt{font-weight:900;font-variant-numeric:tabular-nums;font-size:14px}
.lu.r .p .rt{text-align:left}.lu.r .p .nmp{text-align:right}.lu.r .p .no{text-align:right}
.lu .p .ev{font-size:11px}
.rt.hi{color:#4dff8f}.rt.mid{color:#d7ff6a}.rt.lo{color:#ffb23e}.rt.bad{color:#ff6b6b}
.pitchwrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line2);box-shadow:var(--shadow);background:#0c3d1e}
#pitch{display:block;width:100%;height:auto;aspect-ratio:1050/660}
.banner{position:absolute;left:50%;top:14%;transform:translateX(-50%);padding:14px 34px;border-radius:16px;background:rgba(2,16,9,.88);border:2px solid var(--accent);text-align:center;font-weight:900;font-size:28px;letter-spacing:.12em;color:var(--accent);animation:pop .35s ease-out;pointer-events:none;text-shadow:0 0 20px rgba(34,224,107,.6)}
.banner small{display:block;color:var(--text);font-size:14px;letter-spacing:.06em;margin-top:2px}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.v-feed{padding:9px 14px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid var(--line);font-size:14px;font-weight:700;min-height:40px;display:flex;gap:10px;align-items:center}
.v-feed .mn{color:var(--accent);font-weight:900}
.v-tabs{display:flex;justify-content:center;gap:4px}
.v-tabs button{padding:10px 22px;background:rgba(0,0,0,.35);font-weight:900;letter-spacing:.1em;color:var(--muted);border-radius:10px 10px 0 0;border-bottom:3px solid transparent}
.v-tabs button.on{color:#fff;border-bottom-color:var(--accent);background:rgba(34,224,107,.12)}
.v-panel{padding:14px 18px;border-radius:16px;background:rgba(2,16,9,.72);border:1px solid var(--line);min-height:170px}
.st-row{display:grid;grid-template-columns:60px 1fr 60px;gap:12px;align-items:center;margin:9px 0;font-weight:800;font-variant-numeric:tabular-nums}
.st-row .c{text-align:center;font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.st-row .a{text-align:right}.st-row .b{text-align:left}
.stbar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);display:flex;overflow:hidden;gap:2px}
.stbar i{display:block;height:100%}
.ev-row{display:grid;grid-template-columns:46px 26px 1fr;gap:8px;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:14px}
.ev-row .mn{color:var(--accent);font-weight:900}
.ev-row.goal{font-weight:900;color:#fff}
.v-bet{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;margin-bottom:7px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);font-size:13px}
.v-bet .st{font-weight:900}
.v-bet .st.win{color:var(--accent)}.v-bet .st.lose{color:var(--red)}
.v-ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}


/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:radial-gradient(circle at 50% 38%,#0f5a2f 0%,#05200f 55%,#020d07 100%);transition:opacity .7s ease,transform .7s ease,visibility .7s}
#splash.out{opacity:0;transform:scale(1.06);visibility:hidden;pointer-events:none}
.sp-glow{position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(34,224,107,.28),transparent 65%);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.15);opacity:.7}}
.sp-stage{position:relative;height:120px;width:120px;margin-bottom:6px}
.sp-ball{position:absolute;left:10px;width:100px;height:100px;animation:bounce 1s cubic-bezier(.3,.0,.7,1) infinite alternate;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.sp-ball path:first-of-type{transform-origin:50px 50px}
@keyframes bounce{from{top:-8px;transform:rotate(0)}to{top:14px;transform:rotate(180deg)}}
.sp-shadow{position:absolute;bottom:-6px;left:25px;width:70px;height:12px;border-radius:50%;background:rgba(0,0,0,.45);animation:shad 1s cubic-bezier(.3,.0,.7,1) infinite alternate}
@keyframes shad{from{transform:scale(.55);opacity:.3}to{transform:scale(1);opacity:.6}}
.sp-title{position:relative;margin:14px 0 0;font-size:clamp(46px,9vw,92px);font-weight:900;letter-spacing:.08em;line-height:1;display:flex;gap:.04em}
.sp-title span{display:inline-block;opacity:0;transform:translateY(30px) scale(.9);animation:titleIn .8s cubic-bezier(.2,.9,.3,1.2) forwards}
.sp-title .w1{animation-delay:.15s;color:#fff}
.sp-title .w2{animation-delay:.4s;color:var(--accent);text-shadow:0 0 36px rgba(34,224,107,.6)}
@keyframes titleIn{to{opacity:1;transform:none}}
.sp-logo{position:relative;width:min(640px,80vw);height:auto;opacity:0;transform:scale(.8) translateY(20px);animation:logoIn 1s cubic-bezier(.2,.9,.3,1.15) .15s forwards,glowpulse 2.4s ease-in-out 1.2s infinite;filter:drop-shadow(0 0 28px rgba(34,224,107,.35))}
@keyframes logoIn{to{opacity:1;transform:none}}
@keyframes glowpulse{50%{filter:drop-shadow(0 0 46px rgba(34,224,107,.65))}}
.sp-tag{position:relative;margin-top:10px;letter-spacing:.42em;text-transform:uppercase;font-size:12px;color:var(--muted);font-weight:800;opacity:0;animation:fade .8s .9s forwards}
.sp-bar{position:relative;margin-top:38px;width:min(380px,72vw);height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;opacity:0;animation:fade .5s 1s forwards}
.sp-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#12b556,#22e06b,#9dffc0);box-shadow:0 0 14px rgba(34,224,107,.8);position:relative}
.sp-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:sheen 1.1s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.sp-msg{position:relative;display:flex;justify-content:space-between;width:min(380px,72vw);margin-top:9px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;opacity:0;animation:fade .5s 1s forwards}
.sp-msg b{color:var(--accent);font-variant-numeric:tabular-nums}
.sp-pow{position:absolute;bottom:34px;display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:800;opacity:0;animation:fade .8s 1.2s forwards}
.sp-pow img{height:26px;width:auto;max-width:90px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
@keyframes fade{to{opacity:1}}
/* ---------- polish & motion ---------- */
.top{background:linear-gradient(135deg,rgba(24,80,48,.7),rgba(6,24,14,.9));backdrop-filter:blur(8px)}
.card{transition:border-color .2s,transform .25s,box-shadow .25s}
.fx:hover{transform:translateY(-2px);box-shadow:0 22px 50px rgba(0,0,0,.45),0 0 0 1px rgba(34,224,107,.25)}
main.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.05s}main.enter>*:nth-child(3){animation-delay:.1s}main.enter>*:nth-child(4){animation-delay:.15s}main.enter>*:nth-child(5){animation-delay:.2s}main.enter>*:nth-child(6){animation-delay:.25s}main.enter>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.odd{transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
.odd:active:not(:disabled){transform:scale(.94)}
.odd.sel{box-shadow:0 0 0 3px rgba(34,224,107,.25),0 6px 18px rgba(34,224,107,.35);animation:selpop .3s}
@keyframes selpop{50%{transform:scale(1.07)}}
.tab{transition:.2s}.tab:hover:not(.on){border-color:var(--line2);color:var(--text);transform:translateY(-1px)}
.btn{box-shadow:0 6px 16px rgba(34,224,107,.18)}.btn.ghost,.btn.gold{box-shadow:none}
.leg{animation:legin .25s ease-out}@keyframes legin{from{opacity:0;transform:translateX(14px)}}
.cd.soon{color:var(--gold);animation:pulse .8s infinite}
.wallet.up{animation:flashup .9s}.wallet.down{animation:flashdown .9s}
@keyframes flashup{30%{box-shadow:0 0 0 4px rgba(34,224,107,.55),0 0 30px rgba(34,224,107,.5);border-color:var(--accent)}}
@keyframes flashdown{30%{box-shadow:0 0 0 4px rgba(255,90,95,.5);border-color:var(--red)}}
.viewer{animation:vin .4s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:scale(.97)}}
.v-score .sc.bump{animation:scbump .8s}
@keyframes scbump{30%{transform:scale(1.35);color:#fff}}
.banner{box-shadow:0 0 0 0 rgba(34,224,107,.5);animation:pop .35s ease-out,ring 1.2s ease-out}
@keyframes ring{to{box-shadow:0 0 0 60px rgba(34,224,107,0)}}
.lu .p .rt{transition:color .3s}
.empty{animation:rise .5s both}
.live-dot{animation:pulse 1s infinite}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.brand{flex-direction:column;align-items:flex-start;gap:6px}
.brand #brandTitle{height:40px;width:auto;border-radius:0;background:none;padding:0;display:block;filter:drop-shadow(0 0 14px rgba(34,224,107,.3))}
.brand .pow{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:800}
.brand .pow img{height:20px;width:auto;border-radius:0;background:none;padding:0}
.mk{display:block}
.odds.big{gap:8px}
.odds.big .odd{padding:12px 8px}
.odds.big .odd .k{font-size:12px;color:var(--text);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;margin-bottom:2px}
.odds.big .odd .v{font-size:19px}
.odds.big .odd.sel .k{color:var(--accent-ink)}
.more-btn{margin-top:10px;background:none;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.06em;padding:4px 0}
.more-btn:hover{color:var(--accent)}
.more{display:none;margin-top:10px;gap:14px;flex-wrap:wrap;animation:rise .3s both}
.fx.open .more{display:flex}
.more .grp{flex:1 1 160px}
.to-win{display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px;padding:10px 12px;border-radius:12px;background:rgba(34,224,107,.1);border:1px solid rgba(34,224,107,.3)}
.to-win span{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.to-win b{font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.fab{display:none}
@media(max-width:1080px){
  .layout{grid-template-columns:1fr}
  .slip{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;border-radius:22px 22px 0 0;max-height:78vh;overflow:auto;transform:translateY(105%);transition:.25s}
  .slip.open{transform:none}
  .fab{display:flex;position:fixed;right:16px;bottom:16px;z-index:55;padding:14px 20px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:900;box-shadow:var(--shadow);align-items:center;gap:8px}
  .v-body{grid-template-columns:1fr 1fr}
  .v-body .pitchwrap{grid-column:1/-1;order:-1}
}
@media(max-width:700px){
  .app{padding:12px}
  .fx-main{grid-template-columns:1fr}
  .v-score{gap:8px}.v-score .nm{font-size:12px;line-height:1.1;overflow:hidden}.v-score img{width:36px;height:36px;flex:none}.v-score .sc{font-size:32px}.v-score .mid{min-width:80px}.v-bar .btn{white-space:nowrap}#vComp{display:none}
  .v-body{grid-template-columns:1fr}
  .lu .p{font-size:12px}
  .rs{grid-template-columns:1fr auto 1fr;}.rs .btn{grid-column:1/-1}
  .brand h1{font-size:19px}
}
.club-link{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:#52c48477;text-underline-offset:3px}
.club-link:hover{color:var(--accent)}.ps-card{padding:16px;margin-bottom:12px}.ps-card h2,.ps-dialog h2{margin:0 0 10px;font-size:19px}
.ps-table{overflow-x:auto}.ps-table table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.ps-table th,.ps-table td{padding:8px 7px;text-align:right;border-bottom:1px solid #94cba329}
.ps-table th:first-child{text-align:left}.ps-table tbody th{font-weight:500}.ps-list{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #94cba329}.ps-you{color:var(--accent)}
.ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.ps-dialog{background:#102419;color:#eefaf0;border:1px solid #417458;border-radius:16px;width:min(560px,calc(100vw - 28px));max-height:85vh;padding:18px;overflow:auto}
.ps-dialog::backdrop{background:#0009}#psSlipDialog .slip{display:block;position:static;width:auto;max-height:none;margin-top:12px;box-shadow:none;transform:none}
.ps-live-wide{grid-column:1/-1;min-width:0;width:100%}.ps-market{padding:10px 0 0}.ps-market .odds{margin-bottom:7px}.ps-market .odd{min-width:0}.ps-market .odd .k{overflow-wrap:anywhere}.ps-market .odd:disabled{opacity:.6}
@media(max-width:620px){.ps-market .odd{padding:7px 4px}.ps-market .odd .k{font-size:10px}.ps-market .sec-title{flex-wrap:wrap;gap:5px}.ps-table th,.ps-table td{padding:7px 4px}.ps-table{font-size:12px}}

@media (max-width: 700px) and (pointer: coarse) {
  .top { backdrop-filter: none; -webkit-backdrop-filter: none; background: #102c1e; }
  .sp-glow, .sp-ball, .sp-shadow, .sp-bar i::after { animation: none; }
  .sp-ball { filter: none; }
  .sp-logo { animation: none; opacity: 1; transform: none; }
  main.enter > * { animation: none; }
}
</style>

<script>
"use strict";
/* ============================================================
   FUS BETS — runs on the Football Universe Simulator engine:
   same team strengths, same score model (home advantage, form,
   variance, dominance bonus, Poisson goals), same real rosters.
   ============================================================ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
const T=FUS_TEAMS;
const SAVE_KEY="fusBetsV1";
const START_BAL=1000, MS_PER_MIN=1400, MARGIN=1.07;

/* ---------- FUS engine pieces ---------- */
const COMPS=[
  {id:"epl",name:"Premier League",cat:"league",teams:[0,1,2,3,4,5],icon:"🏴"},
  {id:"liga",name:"La Liga",cat:"league",teams:[6,7,8,9,10,11],icon:"🇪🇸"},
  {id:"sa",name:"Serie A",cat:"league",teams:[12,13,14,15,16,17],icon:"🇮🇹"},
  {id:"bl",name:"Bundesliga",cat:"league",teams:[18,19,20,21,22,23],icon:"🇩🇪"},
  {id:"l1",name:"Ligue 1",cat:"league",teams:[24,25,26,27,28,29],icon:"🇫🇷"},
  {id:"cc",name:"Champions Cup",cat:"cup",teams:T.map((_,i)=>i),icon:"🏆"}
];
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
const FACT=[1];for(let i=1;i<14;i++)FACT[i]=FACT[i-1]*i;
const pois=(l,k)=>Math.exp(-l)*Math.pow(l,k)/FACT[k];
function formVal(t){const f=S.form[t]||[];if(!f.length)return 0;return clamp(f.slice(-5).reduce((a,r)=>a+(r==="W"?1:r==="L"?-1:0),0)/f.length,-1.5,1.5)}
const variance=cat=>cat==="league"?1.15:1.22;
function expectedGoals(h,a,cat,swing){
  const homeAdv=cat==="league"?2.0:1.0;
  const gap=(T[h].s+homeAdv+formVal(h))-(T[a].s+formVal(a));
  const sw=gap/(cat==="league"?22:20), dom=Math.max(0,Math.abs(gap)-14)/55;
  let he=1.22+sw+(gap>0?dom:0)+swing, ae=1.22-sw+(gap<0?dom:0)-swing;
  return [clamp(he,.08,5.4),clamp(ae,.08,5.4)];
}
function simulateScore(h,a,cat){ // FUS simulateScore
  const [he,ae]=expectedGoals(h,a,cat,(Math.random()-.5)*variance(cat));
  return [Math.min(poisson(he),9),Math.min(poisson(ae),9)];
}
function marketProbs(h,a,cat){
  const v=variance(cat),acc={h:0,d:0,a:0,o:0,b:0};
  [-.5,-.25,0,.25,.5].forEach(s=>{
    const [he,ae]=expectedGoals(h,a,cat,s*v);
    for(let i=0;i<11;i++)for(let j=0;j<11;j++){
      const p=pois(he,i)*pois(ae,j)/5;
      if(i>j)acc.h+=p;else if(i===j)acc.d+=p;else acc.a+=p;
      if(i+j>2.5)acc.o+=p; if(i>0&&j>0)acc.b+=p;
    }
  });
  const tot=acc.h+acc.d+acc.a;
  return {"1":acc.h/tot,"X":acc.d/tot,"2":acc.a/tot,"O":acc.o/tot,"U":1-acc.o/tot,"Y":acc.b/tot,"N":1-acc.b/tot};
}
const toOdds=p=>Math.max(1.04,Math.round(100/(p*MARGIN))/100);

let S=null;

function freshState(){

}
let saveT=0;
function save(force){
  const n=Date.now();if(!force&&n-saveT<2500)return;saveT=n;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}
}
window.addEventListener("beforeunload",()=>save(true));

/* ---------- fixtures ---------- */
function matchById(id){return S.matches.find(m=>m.id===id)}
function newFixture(firstKo){
  const open=new Set(S.matches.filter(m=>m.status!=="finished").flatMap(m=>[m.h,m.a]));
  for(let tries=0;tries<30;tries++){
    const comp=Math.random()<.22?COMPS[5]:pick(COMPS.slice(0,5));
    const pool=comp.teams.filter(t=>!open.has(t));
    if(pool.length<2)continue;
    const [h,a]=shuffle(pool);
    const lastKo=S.matches.filter(m=>m.status==="upcoming").reduce((x,m)=>Math.max(x,m.ko),0);
    const ko=firstKo!=null?firstKo:lastKo+rnd(18,42);
    const probs=marketProbs(h,a,comp.cat);
    const [he,ae]=expectedGoals(h,a,comp.cat,0);
    const odds={};for(const k in probs)odds[k]=toOdds(probs[k]);
    const m={id:S.mid++,comp:comp.id,cat:comp.cat,h,a,md:S.md,status:"upcoming",ko,odds,probs,he,ae,minute:0,acc:0,hold:0,hg:0,ag:0};
    S.matches.push(m);
    if(S.matches.filter(x=>x.md===S.md).length>=6)S.md++;
    return m;
  }
  return null;
}
function topUpFixtures(){
  let n=S.matches.filter(m=>m.status==="upcoming").length;
  while(n<12){if(!newFixture())break;n++}
}

/* ---------- lineups ---------- */
const SLOTS=[ // pos, shirt, x, y (home attacks +x)
  ["GK",1,.05,.5],["RB",2,.22,.86],["CB",4,.2,.62],["CB",5,.2,.38],["LB",3,.22,.14],
  ["CM",6,.4,.7],["CAM",10,.5,.5],["CM",8,.4,.3],["RW",7,.7,.84],["LW",11,.7,.16],["ST",9,.77,.5]
];
const POSG={GK:"G",RB:"D",LB:"D",CB:"D",CM:"M",CAM:"M",LW:"F",RW:"F",ST:"F"};
function buildXI(t){
  const injured=new Set(injuriesFor(t).map(([name])=>name));
  const pl=T[t].pl.map((p,i)=>({n:p[0],pos:p[1],ovr:p[2]||0,i})).filter(p=>!injured.has(p.n)),used=new Set(),xi=[];
  SLOTS.forEach(sl=>{
    let p=pl.find(q=>!used.has(q.i)&&q.pos===sl[0])||pl.find(q=>!used.has(q.i)&&POSG[q.pos]===POSG[sl[0]])||pl.find(q=>!used.has(q.i));
    if(p)used.add(p.i);
    xi.push({n:p?.n||"Unavailable",pos:sl[0],no:sl[1],x:sl[2],y:sl[3],ovr:p?.ovr||0,off:!p});
  });
  return xi;
}
const ATT_W={GK:0,CB:.4,LB:.7,RB:.7,CM:1.6,CAM:3,LW:3.6,RW:3.6,ST:5.5};
function weighted(xi,excl){const w=xi.map((p,i)=>i===excl||p.off?0:(ATT_W[p.pos]??1)*(p.ovr?1+(p.ovr-80)/60:1));let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){r-=w[i];if(r<0)return i}return xi.findIndex((p,i)=>!p.off&&i!==excl)}

/* ---------- match lifecycle ---------- */
function startMatch(m){
  m.status="live";m.minute=0;m.acc=0;m.hold=900;
  m.xi=[buildXI(m.h),buildXI(m.a)];
  initPersonnel(m);
  if (removeExpiredPicks()) toast("Pre-match picks closed at kickoff and were cleared from the slip.", "gold");
  if(watch===m.id)playEffect("ko");
  const [hg,ag]=simulateScore(m.h,m.a,m.cat);
  m.total=90+Math.floor(rnd(1,5));
  const sides=shuffle([...Array(hg).fill(0),...Array(ag).fill(1)]);
  const mins=[];sides.forEach(()=>{let x,g=0;do{x=Math.floor(rnd(3,m.total+1));g++}while(mins.some(v=>Math.abs(v-x)<2)&&g<80);mins.push(x)});mins.sort((a,b)=>a-b);
  m.goals=sides.map((s,i)=>{const sc=weighted(m.xi[s],-1);let as=weighted(m.xi[s],sc);if(Math.random()<.22)as=-1;return{min:mins[i],side:s,sc,as}});
  m.fh=hg;m.fa=ag;
  const gap=(T[m.h].s+(m.cat==="league"?2:1))-T[m.a].s;
  m.pb=clamp(50+gap*1.1,34,66);m.poss=[m.pb,100-m.pb];
  m.st={shots:[0,0],sot:[0,0],corners:[0,0],fouls:[0,0],yc:[0,0],rc:[0,0],saves:[0,0]};
  m.rt=m.xi.map(x=>x.map(()=>6));
  m.log=[{min:0,t:"ko",tx:"Kick-off! "+T[m.h].n+" vs "+T[m.a].n+" — "+compName(m)}];
  m.flash=null;
  S.dirty=true;
  const my=openBetsOn(m.id);
  if(my.length)toast("🔴 LIVE: "+T[m.h].n+" vs "+T[m.a].n+" — your bet is on! Tap to watch.","gold",()=>openViewer(m.id),7000);
}
const compName=m=>COMPS.find(c=>c.id===m.comp).name;
const openBetsOn=id=>S.bets.filter(b=>b.status==="open"&&b.legs.some(l=>l.mid===id));
function short(n){const p=n.split(" ");if(p.length<2)return n;const l=p[p.length-1],pre=p[p.length-2];return(p.length>2&&/^(van|de|da|di|dos|ter|von|le|la|del|el|al|mac|ben)$/i.test(pre))?pre+" "+l:l}
function bumpRt(m,side,idx,d){m.rt[side][idx]=clamp(m.rt[side][idx]+d,3,10)}
function logEv(m,t,tx,side,extra){m.lid=(m.lid||0)+1;m.log.unshift(Object.assign({id:m.lid,min:m.minute,t,tx,side},extra||{}));if(m.log.length>80)m.log.pop()}
function advanceMinute(m){
  m.minute++;const mn=m.minute;
  m.st.throws ??= [0,0];
  m.st.penalties ??= [0,0];
  // goals planned by the FUS score model
  m.goals.filter(g=>g.min===mn&&!g.done).forEach(g=>scoreGoal(m,g));
  for(let s=0;s<2;s++){
    const o=1-s,xg=matchRates(m)[s],sh=weighted(m.xi[s],-1);
    if(Math.random()<xg*.085*(m.poss[s]/50)){
      m.st.shots[s]++;const r=Math.random();
      if(r<.36){m.st.sot[s]++;m.st.saves[o]++;bumpRt(m,o,0,.18);bumpRt(m,s,sh,.05);
        logEv(m,"save",r<.2?"🧤 Great save by "+short(m.xi[o][0].n)+" to deny "+short(m.xi[s][sh].n)+"!":"🎯 "+short(m.xi[s][sh].n)+" tests the keeper — "+short(m.xi[o][0].n)+" holds on.",s);
      }else if(r<.62){logEv(m,"shot","💨 "+short(m.xi[s][sh].n)+" fires wide.",s)}
      else{logEv(m,"shot","🛡️ "+short(m.xi[s][sh].n)+"'s effort is blocked.",s)}
    }
    if(Math.random()<.05)setPiece(m,s,"corner");
    if(Math.random()<.09)setPiece(m,s,"throw");
    if(mn>4&&mn<m.total-1&&Math.random()<.0018)setPiece(m,s,"penalty");
    if(Math.random()<.14){m.st.fouls[s]++;const f=weighted(m.xi[s],-1);bumpRt(m,s,f,-.05);
      if(Math.random()<.2){m.st.yc[s]++;bumpRt(m,s,f,-.3);logEv(m,"card","🟨 Yellow card for "+short(m.xi[s][f].n)+".",s)}
      }
    personnelEvent(m,s);
  }
  // possession drift
  const tgt=m.pb+(m.goals.filter(g=>g.min<=mn&&g.side===1).length-m.goals.filter(g=>g.min<=mn&&g.side===0).length)*3;
  m.poss[0]=clamp(m.poss[0]+(tgt-m.poss[0])*.12+rnd(-2.2,2.2),30,70);m.poss[1]=100-m.poss[0];
  // rating drift
  m.rt.forEach((arr,s)=>arr.forEach((r,i)=>{const lean=(s===0?m.hg-m.ag:m.ag-m.hg);bumpRt(m,s,i,rnd(-.035,.04)+lean*.004)}));
  if(mn===45){logEv(m,"ht","⏸ Half-time: "+T[m.h].n+" "+m.hg+" - "+m.ag+" "+T[m.a].n);m.hold=1800}
  if(mn>=m.total)finishMatch(m);
}
function scoreGoal(m,g){
  if(g.side===0)m.hg++;else m.ag++;
  const sx=m.xi[g.side],o=1-g.side;
  g.name=sx[g.sc].n;
  if(watch===m.id)playEffect("goal");
  m.hold=Math.max(m.hold,1100);
  m.st.shots[g.side]++;m.st.sot[g.side]++;
  bumpRt(m,g.side,g.sc,1.15);if(g.as>=0)bumpRt(m,g.side,g.as,.65);
  sx.forEach((_,i)=>bumpRt(m,g.side,i,.12));
  m.xi[o].forEach((p,i)=>bumpRt(m,o,i,p.pos==="GK"?-.3:(ATT_W[p.pos]<1?-.2:-.06)));
  const tx="⚽ GOAL! "+short(sx[g.sc].n)+" ("+T[g.side===0?m.h:m.a].n+")"+(g.as>=0?" — assist "+short(sx[g.as].n):"")+"  "+m.hg+"-"+m.ag;
  logEv(m,"goal",tx,g.side,{sc:g.sc,who:short(sx[g.sc].n),penalty:g.penalty,score:[m.hg,m.ag]});
  m.flash={id:(m.flash?m.flash.id+1:1),side:g.side,who:short(sx[g.sc].n),score:m.hg+" - "+m.ag};
  g.done=true;
  const my=openBetsOn(m.id);
  if(my.length)toast("⚽ "+T[m.h].n+" "+m.hg+"-"+m.ag+" "+T[m.a].n+" — "+short(sx[g.sc].n)+" scores!","dark",()=>openViewer(m.id),4500);
}
function finishMatch(m){
  m.status="finished";m.minute=m.total;m.hold=0;
  logEv(m,"ft","🏁 Full-time: "+T[m.h].n+" "+m.hg+" - "+m.ag+" "+T[m.a].n);
  if(m.ag===0)m.xi[0].forEach((p,i)=>bumpRt(m,0,i,p.pos==="GK"||ATT_W[p.pos]<1?.5:.1));
  if(m.hg===0)m.xi[1].forEach((p,i)=>bumpRt(m,1,i,p.pos==="GK"||ATT_W[p.pos]<1?.5:.1));
  let best=[-1,-1,0];m.rt.forEach((a,s)=>a.forEach((r,i)=>{if(r>best[2])best=[s,i,r]}));
  m.motm={s:best[0],i:best[1],r:best[2]};
  const res=m.hg>m.ag?[ "W","L"]:m.hg<m.ag?["L","W"]:["D","D"];
  S.form[m.h].push(res[0]);S.form[m.a].push(res[1]);
  S.form.forEach(f=>{while(f.length>8)f.shift()});
  recordResult(m);
  tickInjuries(m);
  if(watch===m.id){playEffect("ft");syncSound();}
  settleMatch(m);
  const fin=S.matches.filter(x=>x.status==="finished");
  while(fin.length>30){const old=fin.shift();S.matches=S.matches.filter(x=>x!==old)}
  topUpFixtures();
  S.dirty=true;save(true);
}

/* ---------- bets ---------- */
const MK={ "1":["1X2","Home win"],"X":["1X2","Draw"],"2":["1X2","Away win"],"O":["OU","Over 2.5 goals"],"U":["OU","Under 2.5 goals"],"Y":["BTTS","Both teams to score — Yes"],"N":["BTTS","Both teams to score — No"] };
const legName=(l)=>l.pick==="1"?T[l.h].n+" to win":l.pick==="2"?T[l.a].n+" to win":l.pick==="X"?"Draw":MK[l.pick][1];
function evalLeg(l,hg,ag){switch(l.pick){case"1":return hg>ag;case"X":return hg===ag;case"2":return ag>hg;case"O":return hg+ag>2.5;case"U":return hg+ag<2.5;case"Y":return hg>0&&ag>0;case"N":return !(hg>0&&ag>0)}}
function logBank(){S.bank.push({t:Date.now(),b:S.wallet});if(S.bank.length>200)S.bank.splice(1,1)}
function settleMatch(m){
  S.bets.filter(b=>b.status==="open").forEach(b=>{
    let touched=false;
    b.legs.forEach(l=>{if(l.mid===m.id&&l.res==null){l.res=evalLeg(l,m.hg,m.ag)?"w":"l";touched=true}});
    if(!touched)return;
    if(b.legs.some(l=>l.res==="l")){b.status="lost";b.payout=0;b.at=settlementTime();settleStreak(false);toast("❌ Bet lost — "+money(b.stake),"bad");logBank()}
    else if(b.legs.every(l=>l.res==="w")){b.status="won";b.payout=Math.round(b.stake*b.odds*100)/100;b.at=settlementTime();S.wallet+=b.payout;
      settleStreak(true);playEffect("win");toast("✅ BET WON! +"+money(b.payout-b.stake)+" profit","gold");logBank()}
  });
}
function liveProb(m,l){
  const rem=clamp((m.total-m.minute-Math.max(0,m.acc)/MS_PER_MIN)/m.total,0,1);
  const [home,away]=matchRates(m);
  const he=(home+.12)*rem,ae=(away+.12)*rem;let p=0;
  for(let i=0;i<9;i++)for(let j=0;j<9;j++)if(evalLeg(l,m.hg+i,m.ag+j))p+=pois(he,i)*pois(ae,j);
  return clamp(p,0,1);
}
function cashOutValue(b){
  if(b.status!=="open"||b.legs.length!==1)return 0;
  const l=b.legs[0],m=matchById(l.mid);if(!m||m.status!=="live")return 0;
  return Math.max(.01,Math.round(b.stake*b.odds*liveProb(m,l)*.9*100)/100);
}
function cashOut(id){
  const b=S.bets.find(x=>x.id===id);if(!b)return;const v=cashOutValue(b);if(!v)return;
  b.status="cashed";settleStreak(false);b.payout=v;b.at=Date.now();S.wallet+=v;logBank();save(true);
  toast("💵 Cashed out "+money(v),"gold");S.dirty=true;refreshAll();
}
function slipTotals(){
  const n=S.slip.length,st=S.stake[S.mode]||0;
  if(S.mode==="single"){const pay=S.slip.reduce((a,s)=>a+st*s.odds,0);return{cost:st*n,odds:null,pay}}
  const o=S.slip.reduce((a,s)=>a*s.odds,1);return{cost:n?st:0,odds:o,pay:n?st*o:0};
}
function toggleSel(mid,pick){
  const m=matchById(mid), quote=marketState(m,pick);
  if(quote.closed)return toast(quote.label,"bad");
  if(m.status==="live"&&S.mode==="acc"){S.mode="single";toast("Live bets are singles.","gold");}
  const mk=MK[pick][0],i=S.slip.findIndex(s=>s.mid===mid&&s.pick===pick);
  if(i>=0)S.slip.splice(i,1);
  else{S.slip=S.slip.filter(s=>!(s.mid===mid&&MK[s.pick][0]===mk));S.slip.push({mid,pick,odds:quote.odds,phase:m.status})}
  renderSlip();markSel();
}
function placeBet(){
  if (removeExpiredPicks()) {
    renderSlip();
    markSel();
    return toast("Expired picks cleared. Review the slip before placing your bet.", "gold");
  }
  const unavailable = S.slip.find(pick => !validSelection(pick));
  if (unavailable) {
    const quote = marketState(matchById(unavailable.mid), unavailable.pick);
    return toast(quote.label === "Suspended"
      ? "A live market is briefly suspended. Wait for its odds to return or remove that pick."
      : "This pick has no available odds. Remove it to place your other picks.", "bad");
  }
  if(syncQuotes())return toast("Live odds changed. Review the new return and place again.","gold");
  const n=S.slip.length,st=Math.round((S.stake[S.mode]||0)*100)/100;
  if(!n)return toast("Your bet slip is empty.","bad");
  if(!Number.isFinite(st)||st>maxStake())return toast("Maximum stake is "+money(maxStake())+".","bad");
  if(!(st>=1))return toast("Minimum stake is $1.","bad");
  const tot=slipTotals();
  if(tot.cost>S.wallet+1e-9)return toast("Not enough balance! You need "+money(tot.cost)+".","bad");
  const mk=s=>{const m=matchById(s.mid);return{mid:s.mid,h:m.h,a:m.a,pick:s.pick,odds:s.odds,phase:s.phase,minute:m.minute,comp:compName(m)}};
  if(S.mode==="acc"){
    if(S.slip.some(s=>s.phase==="live"))return toast("Live bets are singles.","bad");
    if(n<2)return toast("A combo needs at least 2 picks.","bad");
    if(new Set(S.slip.map(s=>s.mid)).size!==n)return toast("A combo can't have two picks from the same match.","bad");
    S.bets.unshift({id:S.bid++,ts:Date.now(),mode:"acc",stake:st,odds:Math.round(tot.odds*100)/100,legs:S.slip.map(mk),status:"open"});
  }else S.slip.forEach(s=>S.bets.unshift({id:S.bid++,ts:Date.now(),mode:"single",stake:st,odds:s.odds,legs:[mk(s)],status:"open"}));
  S.wallet-=tot.cost;S.slip=[];logBank();save(true);
  toast("🎟 Bet placed! Good luck.","");S.dirty=true;refreshAll();
}

/* ---------- toasts ---------- */
function toast(msg,kind,click,ms){
  const d=document.createElement("div");d.className="toast "+(kind||"")+(click?" click":"");d.textContent=msg;
  if(click)d.onclick=()=>{click();d.remove()};
  $("toasts").appendChild(d);while($("toasts").children.length>4)$("toasts").firstChild.remove();
  setTimeout(()=>d.remove(),ms||3800);
}

const formHtml=t=>`<span class="form">${(S.form[t]||[]).slice(-5).map(r=>`<i class="${r}">${r}</i>`).join("")}</span>`;

function betCard(b){
  const live=b.legs.some(l=>{const m=matchById(l.mid);return m&&m.status==="live"});
  const legs=b.legs.map(l=>{
    const m=matchById(l.mid);let right=`<span class="muted">${m?(m.status==="live"?"🔴 "+m.hg+"-"+m.ag+" · "+clockText(m):m.status==="upcoming"?"Starts "+cdText(m.ko):"FT "+m.hg+"-"+m.ag):"—"}</span>`;
    if(l.res==="w")right=`<span class="res-w">✔ Won</span>`;if(l.res==="l")right=`<span class="res-l">✘ Lost</span>`;

/* ---------- pitch engine: every player thinks for himself ---------- */
const PL=105,PW=68;
const VMAX={GK:4.4,CB:6,LB:6.6,RB:6.6,CM:6.5,CAM:6.8,LW:7.2,RW:7.2,ST:7};
const ROLEK={GK:.08,CB:.6,LB:.8,RB:.8,CM:1,CAM:1.05,LW:1.12,RW:1.12,ST:1.18};
const wxs=(s,u)=>s===0?u:PL-u, wys=(s,v)=>s===0?v:PW-v;
const dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function kickoffPos(m,s,i,compress){const p=m.xi[s][i],u=p.x*PL*.95*(compress?.62:1),v=p.y*PW;return{x:wxs(s,u),y:wys(s,v)}}
function newPitch(m){
  const live=m.status==="live";
  const a={id:m.id,kit:kitColors(m),time:0,ball:{x:PL/2,y:PW/2,vx:0,vy:0},owner:{s:0,i:10},lastS:0,state:"owned",queue:[],ev:null,evAge:0,trail:[],lastLid:m.lid||0,shown:[m.hg,m.ag],hold:.7,cele:null,pass:null,shot:null,gk:null,prefer:null,looseT:0,dribbles:0};
  a.p=[0,1].map(s=>m.xi[s].map((pl,i)=>{const k=kickoffPos(m,s,i,live);return{x:k.x,y:k.y,vx:0,vy:0,ph:Math.random()*6}}));
  a.p[0][10].x=PL/2-1;a.p[0][10].y=PW/2;
  a.ball.x=PL/2-.2;
  return a;
}
function scanEvents(m){
  const fresh=[];for(const e of m.log){if(e.id>A.lastLid)fresh.push(e);else break}
  if(!fresh.length)return;
  A.lastLid=fresh[0].id;
  fresh.reverse().forEach(e=>{
    if(e.t==="goal")A.queue.push({type:"goal",side:e.side,sc:e.sc,who:e.who,score:e.score,penalty:e.penalty});
    else if(["corner","throw","penMiss"].includes(e.t))A.queue.push({type:e.t,side:e.side,sc:e.sc});
    else if(e.t==="save"&&e.side!=null)A.queue.push({type:"shot",res:"save",side:e.side});
    else if(e.t==="shot"&&e.side!=null)A.queue.push({type:"shot",res:/blocked/.test(e.tx)?"block":"wide",side:e.side});
  });
  let shots=A.queue.filter(q=>q.type==="shot");

  const order=[];[0,1].forEach(s=>m.xi[s].forEach((p,i)=>{if(!p.off)order.push([s,i,A.p[s][i].y])}));order.sort((a,b)=>a[2]-b[2]);
  const ow=A.state==="owned"?A.owner:null;
  order.forEach(([s,i])=>{
    const p=m.xi[s][i],q=A.p[s][i],x=X(q.x),y=Y(q.y),gk=p.pos==="GK",col=gk?(s===0?"#ffd24a":"#ff8a3d"):kit[s],sp=Math.hypot(q.vx,q.vy);
    const bob=Math.sin(A.time*sp*1.6+i)*Math.min(1.6,sp*.25);
    c.fillStyle="rgba(0,0,0,.3)";c.beginPath();c.ellipse(x+2,y+R*.8,R*.9,R*.38,0,0,7);c.fill();
    if(ow&&ow.s===s&&ow.i===i){c.strokeStyle="rgba(255,255,255,.95)";c.lineWidth=3;c.beginPath();c.arc(x,y+bob,R+6+Math.sin(A.time*8)*1.2,0,7);c.stroke()}
    c.fillStyle=col;c.beginPath();c.arc(x,y+bob,R,0,7);c.fill();c.lineWidth=2.5;c.strokeStyle=lum(col)>150?"#222":"#fff";c.stroke();
    if(sp>.8){const a=Math.atan2(q.vy,q.vx);c.fillStyle=lum(col)>150?"#222":"#fff";c.beginPath();c.moveTo(x+Math.cos(a)*(R+9),y+bob+Math.sin(a)*(R+9));c.lineTo(x+Math.cos(a+.5)*(R+2),y+bob+Math.sin(a+.5)*(R+2));c.lineTo(x+Math.cos(a-.5)*(R+2),y+bob+Math.sin(a-.5)*(R+2));c.fill()}
    c.fillStyle=lum(col)>150?"#111":"#fff";c.font="bold 13px system-ui";c.textAlign="center";c.textBaseline="middle";c.fillText(p.no,x,y+bob+1);
    if(ow&&ow.s===s&&ow.i===i){const nm=short(p.n);c.font="800 14px system-ui";const w=c.measureText(nm).width+14;c.fillStyle="rgba(2,16,9,.78)";c.fillRect(x-w/2,y-R-30,w,20);c.fillStyle="#fff";c.fillText(nm,x,y-R-20)}
  });
  // ball with height for lofted passes and shots
  let z=0;if(A.state==="pass"&&A.pass){const k=Math.min(1,A.pass.t/A.pass.T);if(A.pass.lob)z=Math.sin(k*Math.PI)*11}else if(A.state==="shot"&&A.shot){const k=Math.min(1,A.shot.t/A.shot.T);z=Math.sin(k*Math.PI)*3}
  const bx=X(A.ball.x),by=Y(A.ball.y);
  c.fillStyle="rgba(0,0,0,.4)";c.beginPath();c.ellipse(bx+2,by+6,8-z*.15,3.5,0,0,7);c.fill();
  c.fillStyle="#fff";c.beginPath();c.arc(bx,by-z*2.2-2,8.5,0,7);c.fill();c.strokeStyle="#111";c.lineWidth=2;c.stroke();
  c.fillStyle="#111";c.beginPath();c.arc(bx,by-z*2.2-2,3,0,7);c.fill();
  // status overlays
  if(m.status==="finished"){c.fillStyle="rgba(0,0,0,.45)";c.fillRect(W/2-160,H/2-34,320,68);c.fillStyle="#fff";c.font="900 32px system-ui";c.textAlign="center";c.fillText("FULL TIME",W/2,H/2+2)}
  else if(m.hold>0&&m.minute===45){c.fillStyle="rgba(0,0,0,.45)";c.fillRect(W/2-160,H/2-34,320,68);c.fillStyle="#fff";c.font="900 32px system-ui";c.textAlign="center";c.fillText("HALF TIME",W/2,H/2+2)}

}

/* ---------- main loop ---------- */
let last=performance.now(),uiT=0;
function frame(now){
  requestAnimationFrame(frame);
  if (compactPitch && watch == null && now - last < 50) return;
  const dt=Math.min(.25,(now-last)/1000);last=now;
  step(dt);
  if(watch!=null){pitchStep(dt);drawPitch()}
}
function step(dt){
  const sp=S.speed;
  S.matches.forEach(m=>{
    if(m.status==="upcoming"){m.ko-=dt*sp;if(m.ko<=0)startMatch(m)}
    else if(m.status==="live"){
      if(m.hold>0){m.hold-=dt*1000*sp;return}
      m.acc+=dt*1000*sp;
      let g=0;while(m.acc>=MS_PER_MIN&&m.status==="live"&&g++<30&&!(m.hold>0)){m.acc-=MS_PER_MIN;advanceMinute(m)}
    }
  });
  uiT+=dt;
  if(uiT>.25){uiT=0;
    if(S.dirty)refreshAll();else updateDynamic();
    if(watch!=null)renderViewerLive();
    save();
  }
}

const STAKE_LIMIT = 250;
const LIVE_STAKE_LIMIT = 100;
const STREAK_STEP = 3;
const RANKS = [
  ["Rookie", 0], ["Regular", 100], ["Contender", 300],
  ["Pro", 750], ["High Roller", 1500]
];

function upgradeState() {
  S.archive ??= {};
  S.injuries ??= {};
  S.rewards ??= {day:"", streak:0, longest:0};
  const history = streakHistory();
  S.rewards.lastSettlement = S.bets.reduce((last, bet) => Math.max(last, bet.at || 0), 0);
  S.rewards.streak = history.current;
  S.rewards.longest = Math.max(S.rewards.longest, history.longest);
  S.sound ??= false;
  S.slip.forEach(s => { s.phase ??= "upcoming"; });
  S.matches.filter(m => m.status === "finished").forEach(recordResult);
}

function streakHistory() {
  let current = 0, longest = 0;
  const settled = S.bets.filter(b => b.status !== "open").slice().reverse()
    .sort((a,b) => (a.at || a.ts || 0) - (b.at || b.ts || 0));
  for (const bet of settled) {
    current = bet.status === "won" ? current + 1 : 0;
    longest = Math.max(longest,current);
  }
  return {current,longest};
}

function settlementTime() {
  const time = Math.max(Date.now(), S.rewards.lastSettlement + 1);
  S.rewards.lastSettlement = time;
  return time;
}

function settleStreak(won) {
  const r = S.rewards;
  r.streak = won ? r.streak + 1 : 0;
  r.longest = Math.max(r.longest,r.streak);
  if (r.streak && r.streak % STREAK_STEP === 0) {
    S.wallet += 150;
    toast("Win streak bonus: " + money(150), "gold");
  }
}

function localDay() {
  const date = new Date();
  return [date.getFullYear(),date.getMonth()+1,date.getDate()].join("-");
}

function claimDaily() {
  if (S.rewards.day === localDay()) return;
  S.rewards.day = localDay();
  S.wallet += 250;
  logBank();
  save(true);
  refreshAll();
  toast("Daily bonus: " + money(250), "gold");
}

function recordResult(m) {
  S.archive[m.id] ??= {
    id:m.id, comp:m.comp, h:m.h, a:m.a, hg:m.hg, ag:m.ag,
    scorers:m.goals.filter(g=>g.done).map(g=>[g.side===0?m.h:m.a,g.name || m.xi[g.side][g.sc].n])
  };
}

function resultsArchive() { return Object.values(S.archive).reverse(); }
function injuriesFor(t) { return Object.entries(S.injuries[t] || {}).filter(([,games])=>games>0); }

function scorerRows(t, results = resultsArchive()) {
  const totals = new Map();
  for (const match of results) for (const [club,name] of match.scorers) {
    if (t == null || t === club) totals.set(name,(totals.get(name)||0)+1);
  }
  return [...totals].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
}

function teamButton(t) {
  return `<button class="club-link" data-club="${t}">${esc(T[t].n)}</button>`;
}

function standingsHtml() {
  const results = resultsArchive();
  return COMPS.filter(c=>c.cat==="league").map(comp=>{
    const table = Object.fromEntries(comp.teams.map(t=>[t,{t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}]));
    for (const m of results.filter(m=>m.comp===comp.id)) {
      for (const [t,gf,ga] of [[m.h,m.hg,m.ag],[m.a,m.ag,m.hg]]) {
        const row=table[t];
        if (!row) continue;
        row.p++; row.gf+=gf; row.ga+=ga;
        if(gf>ga){row.w++;row.pts+=3}
        else if(gf===ga){row.d++;row.pts++}
        else row.l++;
      }
    }
    const rows=Object.values(table).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||T[a.t].n.localeCompare(T[b.t].n));
    const first=scorerRows(null,results.filter(m=>m.comp===comp.id))[0];
    return `<section class="card ps-card"><h2>${esc(comp.name)}</h2><div class="ps-table"><table><thead><tr><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows.map(r=>`<tr><th>${teamButton(r.t)}</th><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gf-r.ga}</td><td><b>${r.pts}</b></td></tr>`).join("")}</tbody></table></div><p class="muted">${first?"Top scorer · "+esc(first[0])+" ("+first[1]+")":"Top scorers appear after the first goals."}</p></section>`;
  }).join("");
}

function openPreview(m) {

  details(T[m.h].n+" vs "+T[m.a].n,`<p class="muted">${esc(compName(m))}</p><div class="ps-grid">${clubs}</div><h3>Head-to-head</h3>${head.length?`<p>${homeWins} home club wins · ${draws} draws · ${head.length-homeWins-draws} away club wins</p>${head.slice(0,5).map(resultLine).join("")}`:'<p class="muted">These clubs have no recorded meetings yet.</p>'}`);
}

function profileHtml() {
  const settled=S.bets.filter(b=>b.status!=="open");
  const profit=settled.reduce((sum,b)=>sum+(b.payout||0)-b.stake,0);
  const [level]=RANKS.filter(([,target])=>profit>=target).at(-1) || RANKS[0];
  const nextRank=RANKS.find(([,target])=>target>Math.max(0,profit));
  const rankProgress=nextRank ? money(nextRank[1]-profit)+" net profit to reach "+nextRank[0] : "Top rank reached";
  const wins=settled.filter(b=>b.status==="won").length;
  const best=settled.filter(b=>b.payout>b.stake).sort((a,b)=>(b.payout-b.stake)-(a.payout-a.stake))[0];
  const teamCounts=new Map();
  for(const b of S.bets) for(const l of b.legs) {
    const t=l.pick==="1"?l.h:l.pick==="2"?l.a:null;
    if(t!==null)teamCounts.set(t,(teamCounts.get(t)||0)+1);
  }
  const favorite=[...teamCounts].sort((a,b)=>b[1]-a[1])[0];
  const ladder=[...RANKS.map(([name,target])=>({name,target})),{name:"You · "+level,target:profit,you:true}].sort((a,b)=>b.target-a.target||Number(!!b.you)-Number(!!a.you));
  return `<section class="card ps-card"><h2>${esc(level)}</h2><p>${esc(rankProgress)}</p><p>Settled bets <b>${settled.length}</b> · Win rate <b>${settled.length?Math.round(wins/settled.length*100)+"%":"—"}</b></p><p>Win streak <b>${S.rewards.streak}</b> · Longest <b>${S.rewards.longest}</b> · Bonus ${money(150)} every ${STREAK_STEP} wins in a row</p><p>Most backed club · ${favorite?teamButton(favorite[0]):"—"}</p><p>Best bet · ${best?esc(best.legs.map(legName).join(" + "))+" · "+money(best.payout-best.stake)+" profit":"—"}</p></section><section class="card ps-card"><h2>Local profit leaderboard</h2><p class="muted">Your net bet profit compared with rank targets. Bonuses and refills are excluded.</p>${ladder.map((r,i)=>`<div class="ps-list ${r.you?"ps-you":""}"><span>${i+1}. ${esc(r.name)}</span><b>${money(r.target)}</b></div>`).join("")}</section>`;
}

function marketState(m,k) {
  if(!m || !MK[k]) return {closed:true, label:"Bet closed"};
  if(m.status==="upcoming" && m.ko>0) return {odds:m.odds[k]};
  if(m.status!=="live" || m.minute<1 || m.minute>=m.total-2 || m.hold>0)
    return {closed:true,label:m.status==="live"&&m.minute<m.total-2?"Suspended":"Bet closed"};
  const p=liveProb(m,{pick:k});
  if(p<.008||p>.992) return {closed:true,label:"Bet closed"};
  return {odds:toOdds(p)};
}

function removeExpiredPicks() {
  const remaining = S.slip.filter(pick => {
    const match = matchById(pick.mid);
    return match?.status === pick.phase
      && (match.status === "upcoming" ? match.ko > 0 : match.minute < match.total - 2);
  });
  if (remaining.length === S.slip.length) return false;
  // A combo is one ticket. Keep its terms intact by clearing it when a leg expires.
  S.slip = S.mode === "acc" ? [] : remaining;
  return true;
}

function validSelection(s) {
  const m=matchById(s.mid);
  return m && m.status === s.phase && !marketState(m,s.pick).closed;
}

function maxStake() {
  return S.slip.some(s=>s.phase==="live") ? LIVE_STAKE_LIMIT : STAKE_LIMIT;
}

function syncQuotes() {
  let changed=false;
  for(const s of S.slip) {
    const m=matchById(s.mid), q=marketState(m,s.pick);
    if(m?.status===s.phase && !q.closed && s.odds!==q.odds) {
      s.odds=q.odds; changed=true;
    }
  }
  if(changed) {
    const t=slipTotals();
    if($("slipCost"))$("slipCost").textContent=money(t.cost);
    if($("slipPay"))$("slipPay").textContent=money(t.pay);
    if($("slipWin"))$("slipWin").textContent=money(t.pay-t.cost);
  }
  S.slip.forEach((s,i)=>{
    const el=document.querySelector(`[data-slip-price="${i}"]`);
    const m=matchById(s.mid),quote=marketState(m,s.pick);
    if(el)el.textContent=m?.status!==s.phase?"Bet closed":quote.closed?quote.label:s.odds.toFixed(2);
  });
  return changed;
}

function liveMarkets(m) {
  return `<section class="ps-market"><div class="sec-title"><span>In-play odds</span><span>${m.minute>=m.total-2?"Bet closed":m.minute<1?"Pre-match betting closed at kickoff":m.hold>0?"Markets suspended":"Up to "+money(LIVE_STAKE_LIMIT)+" per live single"}</span></div><div class="odds">${oddBtn(m,"1",T[m.h].n)}${oddBtn(m,"X","Draw")}${oddBtn(m,"2",T[m.a].n)}</div><div class="odds">${oddBtn(m,"O","Over 2.5")}${oddBtn(m,"U","Under 2.5")}${oddBtn(m,"Y","Both score")}${oddBtn(m,"N","Either blanks")}</div></section>`;
}

function updateLiveButtons() {
  document.querySelectorAll("[data-live-market]").forEach(section=>{
    const m=matchById(+section.dataset.liveMarket);
    if(!m) return;
    const markup=liveMarkets(m);
    if(section.dataset.market!==markup) {
      section.dataset.market=markup;
      section.innerHTML=markup;
    }
  });
}

let audioContext, crowd;
function syncSound() {
  if(crowd) crowd.gain.gain.setTargetAtTime(S.sound&&watch!==null&&matchById(watch)?.status==="live"?.035:0,audioContext.currentTime,.12);
}
function unlockAudio() {
  if (!S.sound) return;
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio) return;
  if(!audioContext) {
    audioContext=new Audio();
    const buffer=audioContext.createBuffer(1,audioContext.sampleRate*2,audioContext.sampleRate);
    const data=buffer.getChannelData(0);
    let value=0;
    for(let i=0;i<data.length;i++){value=value*.88+(Math.random()*2-1)*.12;data[i]=value;}
    const source=audioContext.createBufferSource(), gain=audioContext.createGain();
    gain.gain.value=0;source.buffer=buffer;source.loop=true;source.connect(gain);gain.connect(audioContext.destination);source.start();
    crowd={source,gain,buffer};
  }
  audioContext.resume().catch(()=>{});
  syncSound();
}
function playEffect(type) {
  if (!S.sound||!audioContext||audioContext.state!=="running") return;
  const now=audioContext.currentTime;
  if (type==="goal") {
    const source=audioContext.createBufferSource(),gain=audioContext.createGain();
    source.buffer=crowd.buffer;source.connect(gain);gain.connect(audioContext.destination);
    gain.gain.setValueAtTime(.015,now);gain.gain.linearRampToValueAtTime(.32,now+.14);
    gain.gain.exponentialRampToValueAtTime(.001,now+1.7);source.start();return;
  }
  const notes=type==="win"?[660,880,1175,1568]:type==="ft"?[2250,2020,2420]:[2200,2500];
  notes.forEach((hz,i)=>{
    const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(), t=now+i*.11;
    oscillator.type=type==="win"?"triangle":"sine";
    oscillator.frequency.value=hz;gain.gain.setValueAtTime(.045,t);gain.gain.exponentialRampToValueAtTime(.001,t+.17);
    oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(t);oscillator.stop(t+.18);
  });
}
function soundLabels() {
  document.querySelectorAll("[data-sound]").forEach(b=>{b.textContent=S.sound?"Sound on":"Sound off";b.setAttribute("aria-pressed",String(S.sound));});
}

function activeSlot(m,s,i) { return !m.xi[s][i].off; }
function activePicker(m,s,exclude=-1) { return weighted(m.xi[s],exclude); }
function matchRates(m) {
  const modifier=s=>{
    const xi=m.xi[s], absences=xi.filter(p=>p.off).length;
    const red=m.st.rc[s], other=m.st.rc[1-s];
    const change=xi.reduce((sum,p)=>sum+(p.ovr-(p.originalRating??p.ovr)),0);
    return clamp((1-.24*red-.15*Math.max(0,absences-red)+.21*other)*(1+change/240),.42,1.8);
  };
  return [m.he*modifier(0),m.ae*modifier(1)];
}
function replanGoals(m, previousRates = null) {
  const rates=matchRates(m);
  const prior=previousRates || [m.he,m.ae];
  const keep=m.goals.filter(g=>g.done||g.min<=m.minute);
  for(const g of m.goals.filter(g=>!g.done&&g.min>m.minute)) {
    if(Math.random()>Math.min(1,rates[g.side]/prior[g.side])) continue;
    if(!activeSlot(m,g.side,g.sc)) g.sc=activePicker(m,g.side);
    if(g.as>=0&&!activeSlot(m,g.side,g.as)) g.as=-1;
    keep.push(g);
  }
  for(let s=0;s<2;s++) {
    const extra=poisson(Math.max(0,rates[s]-prior[s])*(m.total-m.minute)/m.total);
    for(let i=0;i<extra;i++) {
      const sc=activePicker(m,s);
      keep.push({min:1+m.minute+Math.floor(Math.random()*(m.total-m.minute)),side:s,sc,as:activePicker(m,s,sc)});
    }
  }
  m.goals=keep.sort((a,b)=>a.min-b.min);
}
function initPersonnel(m) {
  if(m.bench) return;
  m.bench=[m.h,m.a].map((t,s)=>T[t].pl.map(([n,pos,ovr],i)=>({n,pos,ovr:ovr||0,no:i+1}))
    .filter(p=>!m.xi[s].some(q=>q.n===p.n)&&!injuriesFor(t).some(([name])=>name===p.n)));
  m.subs=[0,0];
  m.newInjuries=[];
}
function substitute(m,s,i) {
  if(m.subs[s]>=5) return false;
  const old=m.xi[s][i], bench=m.bench[s];
  const j=bench.findIndex(p=>POSG[p.pos]===POSG[old.pos]);
  if(j<0) return false;
  const next=bench.splice(j,1)[0];
  m.xi[s][i]={...old,n:next.n,ovr:next.ovr,no:next.no+20,originalRating:old.originalRating??old.ovr,off:false};
  m.rt[s][i]=6;
  m.subs[s]++;
  logEv(m,"sub","🔄 "+short(next.n)+" replaces "+short(old.n)+".",s);
  return true;
}
function personnelEvent(m,s) {
  initPersonnel(m);
  const prior=matchRates(m);
  const candidates=[1,2,3,4,5,6,7,8,9].filter(i=>activeSlot(m,s,i));
  if(!candidates.length) return;
  const i=pick(candidates), player=m.xi[s][i], minute=m.minute;
  if (minute>8&&minute<85&&Math.random()<.0017&&m.st.rc[s]<2) {
    player.off=true;m.st.rc[s]++;bumpRt(m,s,i,-1.4);
    logEv(m,"red","🟥 "+short(player.n)+" is sent off.",s);
  } else if (minute>8&&minute<86&&Math.random()<.003) {
    const team=s===0?m.h:m.a;
    (S.injuries[team]??={})[player.n]=2;
    m.newInjuries.push([team,player.n]);
    player.off=true;
    logEv(m,"injury","✚ "+short(player.n)+" leaves the pitch injured.",s);
    substitute(m,s,i);
  } else if ([60,72,81].includes(minute)) {
    const eligible=candidates.filter(slot=>m.bench[s].some(p=>POSG[p.pos]===POSG[m.xi[s][slot].pos]));
    if(eligible.length)substitute(m,s,pick(eligible));
  }
  const after=matchRates(m);
  if(prior.some((v,index)=>v!==after[index])) replanGoals(m,prior);
  if(watch===m.id&&A?.owner&&!activeSlot(m,A.owner.s,A.owner.i)) {
    A.owner={s:A.owner.s,i:10}; A.state="owned"; A.pass=null;
  }
}
function tickInjuries(m) {
  for (const t of [m.h,m.a]) for (const [name] of injuriesFor(t)) {
    if(m.newInjuries?.some(([club,n])=>club===t&&n===name))continue;
    if(--S.injuries[t][name]<=0)delete S.injuries[t][name];
  }
}
function setPiece(m,s,type) {
  if(type==="corner")m.st.corners[s]++;
  if(type==="throw")m.st.throws[s]++;
  if(type==="penalty") {
    m.st.penalties[s]++;
    const sc=activePicker(m,s), scored=Math.random()<.76;
    logEv(m,"penalty","Penalty for "+T[s===0?m.h:m.a].n+".",s,{sc,scored});
    if(scored) {
      const g={min:m.minute,side:s,sc,as:-1,penalty:true};
      m.goals.push(g);scoreGoal(m,g);
    } else {
      m.st.shots[s]++;m.st.sot[s]++;m.st.saves[1-s]++;
      logEv(m,"penMiss","🧤 "+short(m.xi[s][sc].n)+" has the penalty saved.",s,{sc});
      m.hold=1500;
    }
    return;
  }
  logEv(m,type,(type==="corner"?"Corner":"Throw-in")+" for "+T[s===0?m.h:m.a].n+".",s);
}
function runRestart(m,e) {
  const s=e.side, sideY=A.ball.y<PW/2?1:PW-1;
  const preferred=e.sc??(e.type==="corner"?8:6);
  const i=activeSlot(m,s,preferred)?preferred:activePicker(m,s,10), kicker=A.p[s][i];
  kicker.x=e.type==="penMiss"?wxs(s,PL-11):e.type==="corner"?wxs(s,PL-1):clamp(A.ball.x,12,PL-12);
  kicker.y=e.type==="penMiss"?PW/2:sideY;
  A.owner={s,i}; A.lastS=s; A.state="owned"; A.ball.x=kicker.x;A.ball.y=kicker.y;
  A.pass=null;A.ev=null;A.shot=null;A.gk=null;
  if(e.type==="penMiss")shoot(m,{type:"shot",res:"save",side:s});
  else {makePass(s,i,10);A.pass.lob=true;}
}
