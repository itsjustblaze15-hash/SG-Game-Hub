<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060d1c">
<title>SG · Game Hub</title>
<link rel="icon" href="assets/sg-logo.png">
<link rel="apple-touch-icon" href="assets/sg-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="hub.css?v=phone-4">
<script defer src="catalog.js?v=pitchside-1"></script>
<script defer src="hub.js?v=pitchside-1"></script>
</head>
<body>
<header class="site-header">
  <div class="topbar">
    <a class="brand" href="./"><img src="assets/sg-logo.png" width="42" height="42" alt="SG"><span>Game Hub</span></a><button type="button" id="refresh-hub" class="refresh-hub" aria-label="Refresh SG to the latest version" title="Refresh SG">↻</button>
    <label class="search"><span class="search-icon" aria-hidden="true"></span><input id="search" type="search" autocomplete="off" placeholder="Search games" aria-label="Search your games"></label>
  </div>
</header>
<main>
  <div class="library-heading">
    <h1>All games <span id="count" aria-live="polite"></span></h1>
    <div class="library-tools"><div id="legend"></div><button type="button" id="reorder" aria-pressed="false">Reorder</button></div>
  </div>
  <p class="reorder-help" id="reorder-help" hidden>Drag the handle or use the arrows to move a game.</p>
  <div class="grid" id="games"></div>
  <div class="sr-only" id="order-status" aria-live="polite"></div>
  <p class="empty" id="empty" hidden>No games match your search.</p>
</main>
<dialog id="details" aria-labelledby="game-title">
  <div class="detail-cover">
    <img id="game-cover" alt="">
    <form method="dialog"><button class="close" aria-label="Close game details">×</button></form>
  </div>
  <div class="detail-content">
    <p id="game-genre" class="genre"></p>
    <h2 id="game-title"></h2>
    <p id="game-description"></p>
    <div id="game-devices"></div>
    <button type="button" id="play" class="play" hidden>Play now</button>
    <p id="availability" class="availability" hidden>Playable in SG on Mac.</p>
  </div>
</dialog>
<section id="player" class="player" aria-labelledby="player-title" hidden>
  <header class="player-bar">
    <button type="button" id="exit-game">Back to SG</button>
    <strong id="player-title"></strong>
  </header>
  <div class="rotate-prompt" id="rotate-prompt" hidden>
    <span class="rotate-mark" aria-hidden="true">↻</span>
    <h2>Turn your phone sideways</h2>
    <p>If the screen stays upright, turn off Portrait Orientation Lock.</p>
  </div>
  <div id="player-frame" class="player-frame"></div>
</section>
<noscript>Enable JavaScript to view the SG library.</noscript>
</body>
</html>
